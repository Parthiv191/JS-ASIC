name: docs

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # apt mirrors have had DNS outages (.github/ci-failures.md): retry fetches machine-wide,
      # then wait out a short outage before anything installs
      - name: Make apt retry
        shell: bash
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          for i in 1 2 3 4 5 6; do sudo apt-get update && break; echo "apt-get update failed ($i), retrying"; sleep 30; done

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6  # ttihp27a
        with:
          tools-ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
