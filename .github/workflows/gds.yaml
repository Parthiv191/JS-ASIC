name: gds

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded branch runs are cancelled; every commit on main keeps its own result
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # gds runs only when hardware changes. A workflow-level paths filter would leave the
  # required checks pending, so the skip is a job-level if: (a skipped job counts as a pass).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      hw: ${{ steps.diff.outputs.hw }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Diff against the merge-base with main
        id: diff
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "hw=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=$(git merge-base origin/main HEAD)
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/|flow/|test/|info\.yaml$|\.github/workflows/gds\.yaml$)'; then
            echo "hw=true" >> "$GITHUB_OUTPUT"
          else
            echo "hw=false" >> "$GITHUB_OUTPUT"
          fi

  gds:
    needs: changes
    if: needs.changes.outputs.hw == 'true'
    runs-on: ubuntu-24.04
    # post-GRT design repair is marked experimental ("may result in hangs"); a normal run takes ~35 min
    timeout-minutes: 120
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6  # ttihp27a
        with:
          pdk: ihp-sg13cmos5l
          tools-ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f  # tt-support-tools main, 11-05

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6  # ttihp27a
        with:
          tools-ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6  # ttihp27a

  # co-sim on the gate-level netlist (test/cosim/README.md §5), set up as gl_test sets up its run
  cosim_gl:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download the netlist
        uses: actions/download-artifact@v7
        with:
          name: tt_submission

      - name: PDK version
        shell: bash
        run: echo "PDK_VERSION=$(jq -r .PDK_VERSION tt_submission/pdk.json)" >> $GITHUB_ENV

      - name: Install the PDK
        uses: TinyTapeout/ciel-action@7ac3e42cf2e1a080f1fc6d7b56d732a2ad17d9f6  # v1
        with:
          pdk_name: ihp-sg13cmos5l
          pdk_version: ${{ env.PDK_VERSION }}
          pdk_root: /home/runner/pdk

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      # Icarus 12 leaves every IHP flop at X (test/cosim/README.md): TT's Icarus 13, as gl_test
      - name: Install iverilog
        shell: bash
        run: |
          wget -q https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          sudo apt-get update -y
          sudo apt-get install -y ./iverilog_13.0-1_amd64.deb

      - name: Co-sim at gate level
        shell: bash
        run: |
          cd test/cosim
          make GATES=yes PDK_ROOT=/home/runner/pdk GL_NETLIST=$(ls $GITHUB_WORKSPACE/tt_submission/*.v)
          python -m cocotb_tools.check_results results.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cosim_gl_results
          path: test/cosim/results.xml

  viewer:
    needs: gds
    # branch runs must not overwrite the page built from main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@e7a50f8f46f9f8df4b2c9935bfeb1cbc6b6ae4f6  # ttihp27a
