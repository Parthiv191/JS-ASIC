# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Parthiv"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable protocol emulator: UART, SPI and I2C in firmware, in any role, with a learning bus fuzzer"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM (IHP).
  tiles: "8x4"          # Valid values (IHP CMOS5L): 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_prot_emu_SAP"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "host_spi.v"
    - "uart_tx.v"
    - "prog_mem.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_SCK"
  ui[1]: "HOST_MOSI"
  ui[2]: "HOST_CS_N"
  ui[3]: "FLASH_MISO"
  ui[4]: "BOOT strap"
  ui[5]: ""
  ui[6]: "TESTMODE direction"
  ui[7]: "TESTMODE strap"

  # Outputs
  uo[0]: "HOST_MISO"
  uo[1]: "IRQ"
  uo[2]: "ERR"
  uo[3]: "FLASH_SCK"
  uo[4]: "FLASH_CS_N"
  uo[5]: "FLASH_MOSI"
  uo[6]: "REPORT (UART TX)"
  uo[7]: "ACT"

  # Bidirectional pins
  uio[0]: "IO0"
  uio[1]: "IO1"
  uio[2]: "IO2"
  uio[3]: "IO3"
  uio[4]: "IO4"
  uio[5]: "IO5"
  uio[6]: "IO6"
  uio[7]: "IO7"

# Do not change!
yaml_version: 6
